name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual re-trigger (a dropped push event once skipped CI)

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy apps/api/src apps/worker/src packages/shared/src
      - name: Unit tests
        run: pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check + build
        run: npm run build
      - name: Unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        # Build-time interpolation only — the fail-closed required vars are
        # satisfied with placeholders; real secrets live only in deployment .env.
        run: docker compose -f infrastructure/docker-compose.yml build api worker
        env:
          EVOLUTION_API_KEY: ci-build-placeholder
          EVOLUTION_WEBHOOK_SECRET: ci-build-placeholder
