[alembic]
# %(here)s is the folder containing this ini (infrastructure/alembic), which is
# itself the scripts dir — so commands work from the repo root:
#   alembic -c infrastructure/alembic/alembic.ini upgrade head
script_location = %(here)s
prepend_sys_path = .

# URL is taken from DATABASE_URL at runtime (env.py); this value is only a fallback.
sqlalchemy.url = postgresql+psycopg://pia:pia@localhost:5432/pia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
