name: pia

# P0 stack (docs/06_Implementation_Plan.md §2.1). Evolution API is added in P1 (F-004)
# once its version is pinned (open question Q4).

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pia}
      POSTGRES_DB: ${POSTGRES_DB:-pia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pia} -d ${POSTGRES_DB:-pia}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-piaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-piaminio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-piaminio} ${MINIO_ROOT_PASSWORD:-piaminio-secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-pia-media}
      "

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pia}:${POSTGRES_PASSWORD:-pia}@postgres:5432/${POSTGRES_DB:-pia}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      EVOLUTION_BASE_URL: http://evolution-api:8080  # container DNS, not localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pia}:${POSTGRES_PASSWORD:-pia}@postgres:5432/${POSTGRES_DB:-pia}
      EVOLUTION_BASE_URL: http://evolution-api:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-piaminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-piaminio-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Evolution API — WhatsApp connector (P1, F-004/005). Image pinned per Q4:
  # maintained image is evoapicloud/evolution-api (atendai/ is stale at v2.2.3).
  evolution-api:
    restart: unless-stopped
    image: evoapicloud/evolution-api:v2.3.7
    env_file: .env
    environment:
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set in infrastructure/.env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-pia}:${POSTGRES_PASSWORD:-pia}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CONFIG_SESSION_PHONE_CLIENT: "PIA"
      TELEMETRY_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/').then(r=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  miniodata:
  evolution_instances:
